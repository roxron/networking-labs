router bgp 100
 bgp router-id 10.100.11.6
 no bgp default ipv4-unicast
 bgp log-neighbor-changes
 neighbor 10.100.12.1 remote-as 100
 neighbor 10.100.12.1 description ISP100RR1
 neighbor 10.100.12.1 update-source lo0
 neighbor 10.100.12.2 remote-as 100
 neighbor 10.100.12.2 description ISP100RR2
 neighbor 10.100.12.2 update-source lo0
 !
 address-family ipv4
  neighbor 10.100.12.1 activate
  neighbor 10.100.12.1 send-label
  neighbor 10.100.12.2 activate
  neighbor 10.100.12.2 send-label
 exit-address-family
 !
 address-family vpnv4
  neighbor 10.100.12.1 activate
  neighbor 10.100.12.1 send-community extended
  neighbor 10.100.12.2 activate
  neighbor 10.100.12.2 send-community extended
 exit-address-family
!
