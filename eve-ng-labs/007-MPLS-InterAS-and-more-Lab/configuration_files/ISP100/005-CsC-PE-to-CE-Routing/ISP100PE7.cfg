ip prefix-list CSC-ISP101-TO-BGP permit 10.101.0.0/16 ge 32
ip prefix-list CSC-BGP-TO-ISP101 permit 10.102.0.0/16 ge 32
!
route-map CSC-ISP101-TO-BGP permit 10
 match ip address prefix-list CSC-ISP101-TO-BGP
!
route-map CSC-BGP-TO-ISP101 permit 10
 match ip address prefix-list CSC-BGP-TO-ISP101
!
vrf definition ISP101
 route-target import 102:102
!
interface lo101
 description CsC endpoint for ISP101
 vrf forwarding ISP101
 ip address 10.100.11.7 255.255.255.255
 ip router isis ISP101
 mpls ip
!
interface g0/2
 ip router isis ISP101
 isis network point-to-point
 mpls ip
!
interface g0/3
 ip router isis ISP101
 isis network point-to-point
 mpls ip
!
router isis ISP101
 vrf ISP101
 net 49.0100.B100.0000.0007.00
 is-type level-2-only
 metric-style wide
 passive-interface lo101
 redistribute bgp 100 ip level-2 route-map CSC-BGP-TO-ISP101
 log-adjacency-changes
!
router bgp 100
 address-family ipv4 vrf ISP101
  redistribute isis ISP101 level-2 route-map CSC-ISP101-TO-BGP
 exit-address-family
!
