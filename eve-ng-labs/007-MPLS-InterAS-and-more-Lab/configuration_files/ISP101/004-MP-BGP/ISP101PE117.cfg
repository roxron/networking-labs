router bgp 101
 bgp router-id 10.101.11.117
 no bgp default ipv4-unicast
 bgp log-neighbor-changes
 neighbor 10.101.12.1 remote-as 101
 neighbor 10.101.12.1 description ISP101RR1
 neighbor 10.101.12.1 update-source lo0
 neighbor 10.101.12.2 remote-as 101
 neighbor 10.101.12.2 description ISP101RR2
 neighbor 10.101.12.2 update-source lo0
 !
 address-family ipv4
  neighbor 10.101.12.1 activate
  neighbor 10.101.12.1 send-label
  neighbor 10.101.12.2 activate
  neighbor 10.101.12.2 send-label
 exit-address-family
 !
 address-family vpnv4
  neighbor 10.101.12.1 activate
  neighbor 10.101.12.1 send-community extended
  neighbor 10.101.12.2 activate
  neighbor 10.101.12.2 send-community extended
 exit-address-family
!
