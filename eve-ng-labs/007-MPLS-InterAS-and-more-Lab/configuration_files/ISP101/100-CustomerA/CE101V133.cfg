vrf definition CustomerA
 rd 11:11
 !
 address-family ipv4
 exit-address-family
!
interface Loopback110
 description CustomerA BGP and OSPF endpoint
 vrf forwarding CustomerA
 ip address 10.11.65.133 255.255.255.255
 ip ospf 11 area 0
!
interface Loopback111
 description CustomerA site prefix
 vrf forwarding CustomerA
 ip address 10.11.75.1 255.255.255.0
!
interface GigabitEthernet0/0.12
 description CustomerA link to ISP101PE115 GigabitEthernet0/10.12
 encapsulation dot1Q 12
 vrf forwarding CustomerA
 ip address 10.11.64.1 255.255.255.252
 ip ospf network point-to-point
 ip ospf 11 area 0
 no shutdown
!
interface GigabitEthernet0/1.12
 description CustomerA link to ISP101PE116 GigabitEthernet0/10.12
 encapsulation dot1Q 12
 vrf forwarding CustomerA
 ip address 10.11.64.5 255.255.255.252
 ip ospf network point-to-point
 ip ospf 11 area 0
 no shutdown
!
router ospf 11 vrf CustomerA
 router-id 10.11.65.133
 passive-interface Loopback110
!
router bgp 65511
 bgp router-id 10.11.65.133
 no bgp default ipv4-unicast
 bgp log-neighbor-changes
 address-family ipv4 vrf CustomerA
  network 10.11.75.0 mask 255.255.255.0
  neighbor 10.101.11.115 remote-as 101
  neighbor 10.101.11.115 description ISP101PE115
  neighbor 10.101.11.115 ebgp-multihop 2
  neighbor 10.101.11.115 update-source Loopback110
  neighbor 10.101.11.115 activate
  neighbor 10.101.11.116 remote-as 101
  neighbor 10.101.11.116 description ISP101PE116
  neighbor 10.101.11.116 ebgp-multihop 2
  neighbor 10.101.11.116 update-source Loopback110
  neighbor 10.101.11.116 activate
 exit-address-family
!
