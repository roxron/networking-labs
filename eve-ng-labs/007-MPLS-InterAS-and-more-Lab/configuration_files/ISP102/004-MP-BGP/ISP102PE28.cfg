router bgp 102
 bgp router-id 10.102.11.28
 no bgp default ipv4-unicast
 bgp log-neighbor-changes
 neighbor 10.102.12.1 remote-as 102
 neighbor 10.102.12.1 description ISP102RR1
 neighbor 10.102.12.1 update-source lo0
 neighbor 10.102.12.2 remote-as 102
 neighbor 10.102.12.2 description ISP102RR2
 neighbor 10.102.12.2 update-source lo0
 !
 address-family ipv4
  neighbor 10.102.12.1 activate
  neighbor 10.102.12.1 send-label
  neighbor 10.102.12.2 activate
  neighbor 10.102.12.2 send-label
 exit-address-family
 !
 address-family vpnv4
  neighbor 10.102.12.1 activate
  neighbor 10.102.12.1 send-community extended
  neighbor 10.102.12.2 activate
  neighbor 10.102.12.2 send-community extended
 exit-address-family
!
