ip extcommunity-list standard RT-CUSTOMERA permit rt 11:11
!
route-map VPNV4-CUSTOMERA permit 10
 match extcommunity RT-CUSTOMERA
!
router bgp 102
 neighbor 10.101.12.1 remote-as 101
 neighbor 10.101.12.1 description InterAS Option C to ISP101RR1
 neighbor 10.101.12.1 update-source Loopback0
 neighbor 10.101.12.1 ebgp-multihop 10
 !
 address-family vpnv4
  neighbor 10.101.12.1 activate
  neighbor 10.101.12.1 send-community extended
  neighbor 10.101.12.1 next-hop-unchanged
  neighbor 10.101.12.1 route-map VPNV4-CUSTOMERA in
  neighbor 10.101.12.1 route-map VPNV4-CUSTOMERA out
 exit-address-family
!
! Migrate CustomerA-only policy to shared InterAS VPNv4 policy
router bgp 102
 address-family vpnv4
  no neighbor 10.101.12.1 route-map VPNV4-CUSTOMERA in
  no neighbor 10.101.12.1 route-map VPNV4-CUSTOMERA out
 exit-address-family
!
no route-map VPNV4-CUSTOMERA permit 10
no ip extcommunity-list standard RT-CUSTOMERA
!
ip extcommunity-list standard RT-INTERAS-VPNV4 permit rt 11:11
ip extcommunity-list standard RT-INTERAS-VPNV4 permit rt 12:12
!
route-map VPNV4-INTERAS-IMPORT permit 10
 match extcommunity RT-INTERAS-VPNV4
!
route-map VPNV4-INTERAS-EXPORT permit 10
 match extcommunity RT-INTERAS-VPNV4
!
router bgp 102
 address-family vpnv4
  neighbor 10.101.12.1 route-map VPNV4-INTERAS-IMPORT in
  neighbor 10.101.12.1 route-map VPNV4-INTERAS-EXPORT out
 exit-address-family
!
