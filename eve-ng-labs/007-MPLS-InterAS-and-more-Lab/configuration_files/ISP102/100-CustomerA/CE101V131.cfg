vrf definition CustomerA
 rd 11:11
 !
 address-family ipv4
 exit-address-family
!
interface Loopback110
 description CustomerA BGP and OSPF endpoint
 vrf forwarding CustomerA
 ip address 10.11.1.131 255.255.255.255
 ip ospf 11 area 0
!
interface Loopback111
 description CustomerA site prefix
 vrf forwarding CustomerA
 ip address 10.11.11.1 255.255.255.0
!
interface GigabitEthernet0/0.12
 description CustomerA link to ISP102PE25 GigabitEthernet0/10.12
 encapsulation dot1Q 12
 vrf forwarding CustomerA
 ip address 10.11.0.1 255.255.255.252
 ip ospf network point-to-point
 ip ospf 11 area 0
 no shutdown
!
interface GigabitEthernet0/1.12
 description CustomerA link to ISP102PE26 GigabitEthernet0/10.12
 encapsulation dot1Q 12
 vrf forwarding CustomerA
 ip address 10.11.0.5 255.255.255.252
 ip ospf network point-to-point
 ip ospf 11 area 0
 no shutdown
!
router ospf 11 vrf CustomerA
 router-id 10.11.1.131
 passive-interface Loopback110
!
router bgp 65511
 bgp router-id 10.11.1.131
 no bgp default ipv4-unicast
 bgp log-neighbor-changes
 address-family ipv4 vrf CustomerA
  network 10.11.11.0 mask 255.255.255.0
  neighbor 10.102.11.25 remote-as 102
  neighbor 10.102.11.25 description ISP102PE25
  neighbor 10.102.11.25 ebgp-multihop 2
  neighbor 10.102.11.25 update-source Loopback110
  neighbor 10.102.11.25 activate
  neighbor 10.102.11.26 remote-as 102
  neighbor 10.102.11.26 description ISP102PE26
  neighbor 10.102.11.26 ebgp-multihop 2
  neighbor 10.102.11.26 update-source Loopback110
  neighbor 10.102.11.26 activate
 exit-address-family
!
