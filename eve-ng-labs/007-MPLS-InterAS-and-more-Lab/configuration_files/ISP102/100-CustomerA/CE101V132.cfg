vrf definition CustomerA
 rd 11:11
 !
 address-family ipv4
 exit-address-family
!
interface Loopback110
 description CustomerA BGP and OSPF endpoint
 vrf forwarding CustomerA
 ip address 10.11.1.132 255.255.255.255
 ip ospf 11 area 0
!
interface Loopback111
 description CustomerA site prefix
 vrf forwarding CustomerA
 ip address 10.11.12.1 255.255.255.0
!
interface GigabitEthernet0/0.12
 description CustomerA link to ISP102PE27 GigabitEthernet0/10.12
 encapsulation dot1Q 12
 vrf forwarding CustomerA
 ip address 10.11.0.9 255.255.255.252
 ip ospf network point-to-point
 ip ospf 11 area 0
 no shutdown
!
interface GigabitEthernet0/1.12
 description CustomerA link to ISP102PE28 GigabitEthernet0/10.12
 encapsulation dot1Q 12
 vrf forwarding CustomerA
 ip address 10.11.0.13 255.255.255.252
 ip ospf network point-to-point
 ip ospf 11 area 0
 no shutdown
!
router ospf 11 vrf CustomerA
 router-id 10.11.1.132
 passive-interface Loopback110
!
router bgp 65511
 bgp router-id 10.11.1.132
 no bgp default ipv4-unicast
 bgp log-neighbor-changes
 address-family ipv4 vrf CustomerA
  network 10.11.12.0 mask 255.255.255.0
  neighbor 10.102.11.27 remote-as 102
  neighbor 10.102.11.27 description ISP102PE27
  neighbor 10.102.11.27 ebgp-multihop 2
  neighbor 10.102.11.27 update-source Loopback110
  neighbor 10.102.11.27 activate
  neighbor 10.102.11.28 remote-as 102
  neighbor 10.102.11.28 description ISP102PE28
  neighbor 10.102.11.28 ebgp-multihop 2
  neighbor 10.102.11.28 update-source Loopback110
  neighbor 10.102.11.28 activate
 exit-address-family
!
