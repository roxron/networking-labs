vrf definition CustomerB
 rd 12:12
 !
 address-family ipv4
 exit-address-family
!
interface Loopback120
 description CustomerB BGP and OSPF endpoint
 vrf forwarding CustomerB
 ip address 10.12.1.131 255.255.255.255
 ip ospf 12 area 0
!
interface Loopback121
 description CustomerB site prefix
 vrf forwarding CustomerB
 ip address 10.12.11.1 255.255.255.0
!
interface GigabitEthernet0/0.13
 description CustomerB link to ISP102PE25 GigabitEthernet0/10.13
 encapsulation dot1Q 13
 vrf forwarding CustomerB
 ip address 10.12.0.1 255.255.255.252
 ip ospf network point-to-point
 ip ospf 12 area 0
 no shutdown
!
interface GigabitEthernet0/1.13
 description CustomerB link to ISP102PE26 GigabitEthernet0/10.13
 encapsulation dot1Q 13
 vrf forwarding CustomerB
 ip address 10.12.0.5 255.255.255.252
 ip ospf network point-to-point
 ip ospf 12 area 0
 no shutdown
!
router ospf 12 vrf CustomerB
 router-id 10.12.1.131
 passive-interface Loopback120
!
router bgp 65000
 address-family ipv4 vrf CustomerB
  network 10.12.11.0 mask 255.255.255.0
  neighbor 10.102.11.25 remote-as 102
  neighbor 10.102.11.25 local-as 65512 no-prepend replace-as
  neighbor 10.102.11.25 description ISP102PE25
  neighbor 10.102.11.25 ebgp-multihop 2
  neighbor 10.102.11.25 update-source Loopback120
  neighbor 10.102.11.25 activate
  neighbor 10.102.11.26 remote-as 102
  neighbor 10.102.11.26 local-as 65512 no-prepend replace-as
  neighbor 10.102.11.26 description ISP102PE26
  neighbor 10.102.11.26 ebgp-multihop 2
  neighbor 10.102.11.26 update-source Loopback120
  neighbor 10.102.11.26 activate
 exit-address-family
!
