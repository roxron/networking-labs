hostname P11
!
vrf definition ISP100
 rd 100:100
 !
 address-family ipv4
  route-target export 100:100
  route-target import 100:100
 exit-address-family
 !
 address-family ipv6
  route-target export 100:100
  route-target import 100:100
 exit-address-family
!
interface Loopback0
 description ISP100 Loopback0
 vrf forwarding ISP100
 ip address 10.100.20.11 255.255.255.255
!
interface GigabitEthernet0/0
 description Shared transport for ISP subinterfaces
 no ip address
 no shutdown
!
interface GigabitEthernet0/0.100
 description ISP100 to P3
 encapsulation dot1Q 100
 vrf forwarding ISP100
 ip address 10.100.3.14 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/1
 description Shared transport for ISP subinterfaces
 no ip address
 no shutdown
!
interface GigabitEthernet0/1.100
 description ISP100 to P4
 encapsulation dot1Q 100
 vrf forwarding ISP100
 ip address 10.100.4.10 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/2
 description ISP100 to ISP100-PE16
 vrf forwarding ISP100
 ip address 10.100.16.2 255.255.255.252
 no shutdown
!
end
