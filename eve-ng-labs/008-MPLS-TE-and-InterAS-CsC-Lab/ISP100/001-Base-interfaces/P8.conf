hostname P8
!
vrf definition ISP100
 rd 100:100
 !
 address-family ipv4
  route-target export 100:100
  route-target import 100:100
 exit-address-family
 !
 address-family ipv6
  route-target export 100:100
  route-target import 100:100
 exit-address-family
!
interface Loopback100
 description ISP100 Loopback100
 vrf forwarding ISP100
 ip address 10.100.20.8 255.255.255.255
!
interface GigabitEthernet0/0
 description Shared transport for ISP subinterfaces
 no ip address
 no shutdown
!
interface GigabitEthernet0/0.100
 description ISP100 to P4
 encapsulation dot1Q 100
 vrf forwarding ISP100
 ip address 10.100.4.6 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/1
 description Shared transport for ISP subinterfaces
 no ip address
 no shutdown
!
interface GigabitEthernet0/1.100
 description ISP100 to P2
 encapsulation dot1Q 100
 vrf forwarding ISP100
 ip address 10.100.2.14 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/2
 description ISP100 to ISP100-PE14
 vrf forwarding ISP100
 ip address 10.100.14.6 255.255.255.252
 no shutdown
!
end
