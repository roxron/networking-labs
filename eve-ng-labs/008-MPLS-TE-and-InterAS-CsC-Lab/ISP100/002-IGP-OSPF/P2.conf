hostname P2
!
router ospf 100 vrf ISP100
 auto-cost reference-bandwidth 1000
 router-id 10.100.20.2
 capability vrf-lite
 passive-interface default
 no passive-interface GigabitEthernet0/0.100
 no passive-interface GigabitEthernet0/1.100
 no passive-interface GigabitEthernet0/2.100
 no passive-interface GigabitEthernet0/3.100
 no passive-interface GigabitEthernet0/4.100
 no passive-interface GigabitEthernet0/5.100
 no passive-interface GigabitEthernet0/6.100
!
interface Loopback100
 ip ospf 100 area 0
!
interface GigabitEthernet0/0.100
 ip ospf 100 area 0
 ip ospf network point-to-point
 no shutdown
!
interface GigabitEthernet0/1.100
 ip ospf 100 area 0
 ip ospf network point-to-point
 no shutdown
!
interface GigabitEthernet0/2.100
 ip ospf 100 area 0
 ip ospf network point-to-point
 no shutdown
!
interface GigabitEthernet0/3.100
 ip ospf 100 area 0
 ip ospf network point-to-point
 no shutdown
!
interface GigabitEthernet0/4.100
 ip ospf 100 area 0
 ip ospf network point-to-point
 no shutdown
!
interface GigabitEthernet0/5.100
 ip ospf 100 area 0
 ip ospf network point-to-point
 no shutdown
!
interface GigabitEthernet0/6.100
 ip ospf 100 area 0
 ip ospf network point-to-point
 no shutdown
!
end
